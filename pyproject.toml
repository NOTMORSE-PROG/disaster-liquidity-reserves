[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-liquidity-reserves"
version = "0.1.0"
description = "Bracket the smallest regional disaster liquidity reserve under overlapping shared-shock assumptions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mark Andrei Condino" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "ruff>=0.5"]
# Only needed to recompile the amplitude-estimation circuits for resource counts.
quantum = ["qiskit==2.2.3"]

[project.scripts]
dlr-app = "liquidity_reserves.app.server:main"
dlr-worker = "liquidity_reserves.worker:main"
dlr-validate = "liquidity_reserves.validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"liquidity_reserves.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "benchmark/src"]
markers = ["slow: longer validation runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
